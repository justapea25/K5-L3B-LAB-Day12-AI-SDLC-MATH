<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 130" width="260" height="130">
  <!-- Cá Sấu Năm Chèo — chibi, nhìn sang phải. Nhóm Math tự vẽ (SVG tay), xem CREDITS.md. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fae4a"/>
      <stop offset="1" stop-color="#2f7a32"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f3b8"/>
      <stop offset="1" stop-color="#c9dc86"/>
    </linearGradient>
  </defs>
  <g stroke="#1f4d22" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- đuôi -->
    <path d="M70 70 C40 60 22 78 6 64 C18 92 52 96 78 86 Z" fill="url(#body)"/>
    <!-- chân -->
    <ellipse cx="92" cy="98" rx="14" ry="11" fill="#3f8f3a"/>
    <ellipse cx="146" cy="100" rx="14" ry="11" fill="#3f8f3a"/>
    <!-- thân -->
    <ellipse cx="118" cy="72" rx="58" ry="30" fill="url(#body)"/>
    <path d="M78 84 C100 98 140 98 160 86" fill="none" stroke="#1f4d22"/>
    <ellipse cx="120" cy="84" rx="40" ry="12" fill="url(#belly)" stroke="none"/>
    <!-- vảy lưng -->
    <path d="M78 52 l8 -12 l8 12 M98 46 l8 -13 l8 13 M118 44 l8 -13 l8 13 M138 46 l8 -12 l8 12" fill="#2f7a32"/>
    <!-- đầu + mõm -->
    <path d="M160 52 C178 40 206 42 236 54 C252 60 252 78 236 82 C210 90 182 92 162 86 Z" fill="url(#body)"/>
    <!-- răng -->
    <path d="M196 84 l5 9 l5 -9 M212 83 l5 9 l5 -9 M228 80 l4 8 l4 -8" fill="#ffffff" stroke-width="2.5"/>
    <!-- lỗ mũi -->
    <circle cx="238" cy="60" r="3" fill="#1f4d22" stroke="none"/>
  </g>
  <!-- mắt to chibi -->
  <circle cx="178" cy="44" r="15" fill="#ffffff" stroke="#1f4d22" stroke-width="4"/>
  <circle cx="182" cy="45" r="7" fill="#2b2b2b"/>
  <circle cx="185" cy="42" r="2.5" fill="#ffffff"/>
  <path d="M164 30 L192 36" stroke="#1f4d22" stroke-width="5" stroke-linecap="round"/>
  <!-- má hồng -->
  <ellipse cx="200" cy="68" rx="8" ry="5" fill="#f48fb1" opacity="0.7"/>
</svg>
