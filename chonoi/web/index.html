<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · P/Esc = tạm dừng · R = chơi lại.
 * Shop (chế độ day): 1 = mua bình oxy · 2 = mua áo phao · Enter = đóng Shop.
 * H = bật/tắt chế độ tương phản cao (hoặc mở với ?contrast=high).
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
function loadArt(name) {
  const image = new Image();
  image.src = "/art/" + name;
  return image;
}
const atlas = loadArt("cho-noi.png");
const riverbank = loadArt("rach-sen.jpg");
const deck = loadArt("nha-be.jpg");
const guestSheet = loadArt("khach.png");
const motionSheet = loadArt("ut-sen-dong.png");
const diving = loadArt("ut-sen-lan.png");
const kitchen = loadArt("bep-mon.png");
const crocArt = loadArt("ca-sau.svg");
const crocFace = {};  // hướng nhìn của từng Cá Sấu, suy từ chuyển động  // Cá Sấu chibi (SVG tự vẽ), mặc định nhìn sang phải
// Rectangles in the packed 625 × 615 transparent atlas.
const sprites = {
  sen: [18, 0, 157, 219], aunt: [230, 0, 151, 219], uncle: [419, 0, 183, 219],
  boat: [0, 255, 206, 135], table: [212, 233, 193, 185], stove: [450, 220, 157, 199],
  fish: [0, 459, 202, 114], lily: [208, 437, 203, 177], flowers: [414, 426, 211, 188]
};
function sprite(name, x, y, height, flip = false) {
  return drawCutout(atlas, sprites[name], x, y, height, flip);
}
function drawCutout(image, rect, x, y, height, flip = false) {
  if (!image.complete || !image.naturalWidth) return false;
  const [left, top, sw, sh] = rect;
  const width = height * sw / sh;
  ctx.save();
  ctx.translate(x, y);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(image, left, top, sw, sh, -width / 2, -height / 2, width, height);
  ctx.restore();
  return true;
}
let snap = null, offline = false;
let stride = 0, moving = false, faceLeft = false;
function updatePose(next) {
  moving = false;
  if (!snap || snap.view !== next.view || next.tick < snap.tick) {
    stride = 0;
    faceLeft = false;
    return;
  }
  if (!snap.player || !next.player || next.state !== "playing") return;
  const dx = next.player.pos[0] - snap.player.pos[0];
  const dy = next.player.pos[1] - snap.player.pos[1];
  const distance = Math.hypot(dx, dy);
  if (distance > 0) {
    moving = true;
    stride = (stride + distance * 2.4) % 4;
    if (dx) faceLeft = dx < 0;
  }
}
function drawSen(x, y, height, swimming) {
  if (moving) {
    const frameX = Math.floor(stride) * 200;
    const rect = swimming ? [frameX, 228, 200, 140] : [frameX, 0, 200, 200];
    if (drawCutout(motionSheet, rect, x, y, height, faceLeft)) return true;
  }
  if (swimming && diving.naturalWidth)
    return drawCutout(diving, [0, 0, diving.width, diving.height], x, y, height, faceLeft);
  return sprite("sen", x, y, height, faceLeft);
}
const dishCells = {
  ca_loc_nuong_trui: 3, ca_keo_nuong: 3,
  canh_chua_ca_loc: 4, lau_mam: 4, lau_ca_linh_dien_dien: 4, goi_bong_sung: 5
};
function kitchenSprite(cell, x, y, height) {
  return drawCutout(kitchen, [(cell % 3) * 200, cell < 3 ? 0 : 210, 200, cell < 3 ? 204 : 190], x, y, height);
}
function drawGuest(id, x, y, height) {
  const variant = (Number((id.match(/\d+$/) || ["1"])[0]) + 7) % 8;
  if (variant >= 6) return sprite(variant === 6 ? "aunt" : "uncle", x, y, height);
  const child = variant === 1 || variant === 3;
  return drawCutout(guestSheet, [(variant % 3) * 200, variant < 3 ? 0 : 193, 200, variant < 3 ? 193 : 207],
                    x, y, height * (child ? .82 : 1));
}

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? (snap.view || snap.mode) : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"),
           pause: down.has("pause"), shop_done: down.has("shop_done"),
           net: down.has("net"), sprint: down.has("sprint") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
// Dùng phím VẬT LÝ (e.code) cho chữ/số/Space để bộ gõ (Telex "ee" -> "ê") hay bố cục bàn phím không làm mất phím E, F, G, WASD.
function keyName(e) {
  const c = e.code || "";
  if (/^Key[A-Z]$/.test(c)) return c.slice(3).toLowerCase();
  if (/^Digit[0-9]$/.test(c)) return c.slice(5);
  if (c === "Space") return " ";
  return e.key.toLowerCase();
}
addEventListener("keydown", (e) => {
  audioUnlock();
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === "f") down.add("net");
  else if (k === "g") down.add("sprint");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "h") { setContrast(!highContrast); }
  else if (k === "n") { soundOn = !soundOn; try { localStorage.setItem("chonoi-sound", soundOn ? "on" : "off"); } catch (e2) {} }
  else if (k === "p" || k === "escape") down.add("pause");
  else if (k === "enter") down.add("shop_done");
  else if (k === "1" || k === "2" || k === "3") { queue.push(JSON.stringify({ buy: { "1": "oxygen", "2": "hp", "3": "net" }[k] })); flush(); }
  else if (k === "k") { fetch("/skip", { method: "POST" }); }   // bỏ qua sang pha kế (demo)
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === "f") down.delete("net");
  else if (k === "g") down.delete("sprint");
  else if (k === " ") down.delete("catch");
  else if (k === "p" || k === "escape") down.delete("pause");
  else if (k === "enter") down.delete("shop_done");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
// Poll song song (tối đa 4 yêu cầu đang chờ, mỗi 33 ms một yêu cầu): qua mạng chậm/tunnel thì độ trễ
// không còn giới hạn tốc độ cập nhật. Chỉ nhận snapshot mới hơn cái đang hiện (theo tick).
let inflightPolls = 0, failStreak = 0;
async function pollOnce() {
  inflightPolls++;
  try {
    const r = await fetch("/state", { cache: "no-store" });
    const s = await r.json();
    if (!snap || s.tick >= snap.tick || s.tick < 5) {
      if (!snap || s.tick !== snap.tick || s.view !== snap.view) updatePose(s);
      snap = s;
    }  // tick nhỏ: vừa chơi lại (R)
    offline = false; failStreak = 0;
  } catch (e) { if (++failStreak > 6) offline = true; }
  inflightPolls--;
}
setInterval(() => { if (inflightPolls < 4) pollOnce(); }, 33);
pollOnce();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const KIND_EMOJI = { ca_loc: "🐟", ca_linh: "🐠", ca_keo: "🐡", bong_dien_dien: "🌼", bong_sung: "🪷", keo_neo: "🌿" };
const DISH_EMOJI = { ca_loc_nuong_trui: "🐟", goi_bong_sung: "🥗", lau_ca_linh_dien_dien: "🍲", canh_chua_ca_loc: "🥣", ca_keo_nuong: "🍢", lau_mam: "🫕" };
function rrect(x, y, w, h, rad) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, rad); else ctx.rect(x, y, w, h); }

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center" });
}
function panel(x, y, w, h) {
  ctx.fillStyle = highContrast ? "rgba(0,0,0,.92)" : "rgba(8,16,24,.62)";
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill(); } else ctx.fillRect(x, y, w, h);
}
let introKey = "", introAt = 0;
function phaseIntro(w, h) {
  // DayIntro / EveningIntro / Shop: hiện 3.5 s mỗi khi đổi pha (chỉ là màn UI, không chiếm tick)
  const view = snap.view || snap.mode, key = (snap.day || 0) + ":" + view;
  if (key !== introKey) { introKey = key; introAt = performance.now(); }
  const t = (performance.now() - introAt) / 1000;
  if (t > 3.5 || snap.finished) return;
  ctx.globalAlpha = Math.min(1, (3.5 - t) * 1.5);
  panel(w / 2 - 340, h / 2 - 120, 680, 220);
  const day = snap.day ? "Ngày " + snap.day + " · " : "";
  const title = { gather: "Buổi sáng — Lặn & Hái", quan: "Buổi tối — Mở Quán", shop: "Shop cuối ngày" }[view] || view;
  text(day + title, w / 2, h / 2 - 62, { align: "center", size: 32, color: "#ffd180" });
  const lines = {
    gather: ["Lặn bắt cá (Space), hái rau trên mặt nước (E), về Bến bấm E để mở quán.",
             "Theo dõi Oxy — nổi lên mặt nước để thở. Tránh Cá Sấu ở vùng sâu!"],
    quan: [snap.demo ? "Má Tư đã đi chợ mua thêm đủ nguyên liệu theo kế hoạch (chế độ demo)." : "Khách tới ngồi bàn và gọi món từ kho bạn mang về.",
           "Tới Bếp bấm E để nấu → lấy món chín → mang tới Bàn bấm E."],
    shop: ["1: Bình oxy · 2: Áo phao · 3: Vợt hút cá · Enter: sang ngày mới",
           "Nâng cấp có hiệu lực từ Ngày kế."] }[view] || [];
  lines.forEach((l, i) => text(l, w / 2, h / 2 - 16 + i * 28, { align: "center", size: 18 }));
  if (view === "gather" && snap.day_plan) {
    const dishes = Object.entries(snap.day_plan.dishes).map(([d, n]) => (DISH_NAME[d] || d) + " ×" + n).join(", ");
    text("Má Tư định nấu: " + dishes, w / 2, h / 2 + 56, { align: "center", size: 18, color: "#a5d6a7" });
  }
  ctx.globalAlpha = 1;
}
function fmtItems(items) {
  // v1.2: kho cá thể -> "cá lóc×2 (tươi 87%), bông súng×1 (ươn 1)"
  if (!Array.isArray(items) || !items.length) return "(trống)";
  const g = {};
  items.forEach((it) => { const e = (g[it.kind] = g[it.kind] || { n: 0, min: 100, bad: 0 }); e.n++; e.min = Math.min(e.min, it.fresh); if (it.fresh < 30) e.bad++; });
  return Object.keys(g).map((k) => (KIND_NAME[k] || k) + "×" + g[k].n + " (tươi ≥" + Math.floor(g[k].min) + "%" + (g[k].bad ? ", ươn " + g[k].bad : "") + ")").join(", ");
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
function niceEvent(e) {
  const d = e.data || {}, k = (x) => KIND_NAME[x] || x, dn = (x) => DISH_NAME[x] || x;
  switch (e.name) {
    case "gather": return "🌿 Hái được " + k(d.kind) + (d.amount > 1 ? " ×" + d.amount : "");
    case "fish_caught": return (KIND_EMOJI[d.kind] || "🐟") + " Bắt được " + k(d.kind) + " ×" + (d.yield || 1);
    case "hold_full": return "🧺 Giỏ không đủ chỗ!";
    case "dive": return "🤿 Lặn xuống";
    case "surface": return "🌊 Nổi lên thở";
    case "oxygen_empty": return "🫧 Hết oxy! Nổi lên ngay";
    case "choke": return "😵 Ngạt nước, còn " + d.hp + " Máu";
    case "monster_hit": return "🐊 Cá Sấu cắn! Mất " + (d.lost || []).length + " món, còn " + d.hp + " Máu";
    case "faint": return "💫 Ngất xỉu — mất cả giỏ";
    case "spoiled": return "🤢 " + k(d.kind) + " bị ươn";
    case "gather_end": return d.reason === "docked" ? "⚓ Cập bến, chuẩn bị mở quán" : d.reason === "time" ? "⏰ Hết giờ buổi sáng" : "💫 Kết thúc buổi sáng";
    case "fish_spawned": return "";
    case "customer_arrived": return "🙋 Khách mới ở Bàn " + d.table_id + ": " + dn(d.dish_id);
    case "no_dish": return "🚫 Khách tới nhưng kho không đủ nguyên liệu";
    case "cook_started": return "🔥 Bắt đầu nấu " + dn(d.dish_id);
    case "dish_ready": return "✅ " + dn(d.dish_id) + " đã chín ở Bếp " + d.stove_id;
    case "dish_picked": return "🍽 Bưng " + dn(d.dish_id);
    case "served": return "😋 Phục vụ Bàn " + d.table_id;
    case "paid": return "💰 Bàn " + d.table_id + " trả " + d.amount + "k" + (d.tip ? " (boa " + d.tip + "k)" : "");
    case "customer_left": return d.reason === "patience" ? "😠 Khách Bàn " + d.table_id + " bỏ về" : "";
    case "dish_burnt": return "🔥 Món ở Bếp " + d.stove_id + " bị cháy!";
    case "bought": return "🛒 Mua " + ({ oxygen: "Bình oxy", hp: "Áo phao", net: "Vợt" }[d.upgrade] || d.upgrade) + " cấp " + d.level;
    case "buy_failed": return "❌ Không mua được (" + ({ funds: "thiếu tiền", max_level: "đã tối đa", unknown: "chưa hỗ trợ" }[d.reason] || d.reason) + ")";
    case "paused": return "⏸ Tạm dừng";
    case "resumed": return "▶ Tiếp tục";
    default: return "";
  }
}
function eventLog(w, h) {
  const ev = (snap.events || []).map((e) => [e, niceEvent(e)]).filter((x) => x[1]).slice(-5);
  ev.forEach(([e, msg], i) => {
    const age = snap.tick - e.tick, alpha = Math.max(0.35, 1 - age / 900);
    const y = h - 96 - (ev.length - 1 - i) * 26;
    ctx.globalAlpha = alpha;
    ctx.font = "15px system-ui, sans-serif"; const tw = ctx.measureText(msg).width + 18;
    panel(w - 14 - tw, y - 18, tw, 24);
    text(msg, w - 23, y, { size: 15, align: "right", color: "#fff" });
    ctx.globalAlpha = 1;
  });
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap.state === "paused") {
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, w, h);
    text("Tạm dừng", w / 2, h / 2 - 10, { align: "center", size: 32 });
    text("P / Esc để tiếp tục · R để chơi lại", w / 2, h / 2 + 24, { align: "center", size: 18, color: "#cfd8dc" });
  }
  if (snap.day) text(`Ngày ${snap.day} · ${snap.view === "gather" ? "Sáng" : snap.view === "quan" ? "Tối" : "Shop"}`, w / 2, 24, { align: "center", size: 18, color: "#ffd180" });
  if (snap.finished && snap.day && snap.reason === "days_complete") { drawSummary(w, h); return; }
  if (snap.finished) {
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(w / 2 - 190, h / 2 - 50, 380, 100);
    const label = snap.day ? "Hết lượt chơi" : "Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc";
    text(label + ": " + (snap.reason || ""), w / 2, h / 2 - 12, { align: "center", size: 20 });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 20, { align: "center", color: "#cfd8dc" });
  }
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 116, bottom = 84;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  // trời (nắng, mây) + nước (gradient, tia nắng, sóng) + đáy cát, rong
  const T = Date.now() / 1000;
  const sky = ctx.createLinearGradient(0, top, 0, oy);
  sky.addColorStop(0, "#ffd59e"); sky.addColorStop(1, "#bfe6f7");
  ctx.fillStyle = sky; ctx.fillRect(0, top, w, SKY * s);
  ctx.fillStyle = "#fff3b0"; ctx.beginPath(); ctx.arc(w - 90, top + 2.2 * s, 1.4 * s, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.85)";
  for (let i = 0; i < 4; i++) {
    const cx = ((i * 330 + T * 12) % (w + 200)) - 100, cy = top + (1 + (i % 2)) * s;
    ctx.beginPath(); ctx.ellipse(cx, cy, 2.2 * s, 0.6 * s, 0, 0, Math.PI * 2); ctx.ellipse(cx + 1.2 * s, cy - 0.35 * s, 1.3 * s, 0.55 * s, 0, 0, Math.PI * 2); ctx.fill();
  }
  if (riverbank.complete && riverbank.naturalWidth) {
    const crop = Math.min(riverbank.height, riverbank.width * SKY / X);
    ctx.drawImage(riverbank, 0, (riverbank.height - crop) * .83, riverbank.width, crop,
                  sx(0), top, X * s, SKY * s);
  }
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));

function quanStep() {

}

  cook_started: [[[400, .05], [420, .05], [400, .05]], "triangle", "♪ xèo xèo — bắt đầu nấu"],
  dish_ready: [[[1047, .1], [1568, .16]], "sine", "♪ ting! — món chín"],
  served: [[[784, .08], [988, .1]], "triangle", "♪ mời khách dùng món"],
  paid: [[[1319, .06], [1568, .06], [2093, .1]], "triangle", "♪ leng keng — thu tiền"],
  customer_left: [[[392, .12], [330, .16]], "sawtooth", "♪ hừm — khách bỏ về"],
  dish_burnt: [[[200, .1], [160, .14]], "sawtooth", "♪ khét lẹt — món cháy!"],
  bought: [[[523, .06], [659, .06], [784, .1]], "triangle", "♪ cạch — mua thành công"],
  spoiled: [[[250, .12]], "sine", "♪ ọc — hàng bị ươn"],
};
const captions = [], popups = [];
function processEvents() {
  if (!snap || !snap.events) return;
  if (snap.tick < lastEvTick) lastEvTick = -1;  // vừa chơi lại
  snap.events.forEach((e) => {
    if (e.tick <= lastEvTick) return;
    if (e.name === "customer_left" && e.data.reason !== "patience") return;
    const fx = SFX[e.name];
    if (fx) { beep(fx[0], fx[1]); captions.push({ msg: fx[2], at: performance.now() }); }
    if (e.name === "paid") popups.push({ kind: "table", id: e.data.table_id, msg: "+" + e.data.amount + "k 💰", at: performance.now() });
    if (e.name === "fish_caught") popups.push({ kind: "player", msg: "+" + (e.data.yield || 1) + " " + (KIND_EMOJI[e.data.kind] || "🐟"), at: performance.now() });
    if (e.name === "gather") popups.push({ kind: "player", msg: "+1 " + (KIND_EMOJI[e.data.kind] || "🌿"), at: performance.now() });
  });
  lastEvTick = Math.max(lastEvTick, ...snap.events.map((e) => e.tick));
}
function drawCaptions(w, h) {
  // phụ đề SFX: hiện cả khi tắt tiếng, 2.5 s mỗi dòng
  const now = performance.now();
  while (captions.length && now - captions[0].at > 2500) captions.shift();
  captions.slice(-2).forEach((c, i, arr) => {
    const y = h - 118 - (arr.length - 1 - i) * 30;
    ctx.font = "17px system-ui, sans-serif"; const tw = ctx.measureText(c.msg).width + 24;
    panel(w / 2 - tw / 2, y - 21, tw, 28);
    text(c.msg, w / 2, y, { size: 17, align: "center", color: "#e1f5fe" });
  });
  text((soundOn ? "🔊" : "🔇") + " N: âm thanh", w - 14, 30, { size: 15, align: "right", color: "#cfd8dc" });
}
function popupPos(pp, w, h) {
  // vị trí màn hình gần đúng theo tỉ lệ cảnh hiện tại
  if (pp.kind === "player" && snap.player) return [w / 2, h / 2];
  return [w / 2, h / 2];
}
function drawPopups(toScreen) {
  const now = performance.now();
  for (let i = popups.length - 1; i >= 0; i--) if (now - popups[i].at > 1600) popups.splice(i, 1);
  popups.forEach((pp) => {
    let pos = null;
    if (pp.kind === "player" && snap.player) pos = toScreen(snap.player.pos);
    if (pp.kind === "table") { const tb = (snap.tables || []).find((t) => t.id === pp.id); if (tb) pos = toScreen(tb.pos); }
    if (!pos) return;
    const t = (now - pp.at) / 1600;
    ctx.globalAlpha = 1 - t;
    text(pp.msg, pos[0], pos[1] - 30 - t * 50, { size: 22, align: "center", color: "#fff176" });
    ctx.globalAlpha = 1;
  });
}
function fireflies(x0, y0, w0, h0) {
  const T = Date.now() / 1000;
  for (let i = 0; i < 18; i++) {
    const fx = x0 + ((i * 97 + Math.sin(T * 0.5 + i) * 40) % w0 + w0) % w0;
    const fy = y0 + ((i * 53 + Math.cos(T * 0.7 + i * 2) * 25) % h0 + h0) % h0;
    const a = 0.3 + 0.7 * Math.max(0, Math.sin(T * 2 + i * 1.7));
    ctx.fillStyle = `rgba(255,241,118,${a})`; ctx.beginPath(); ctx.arc(fx, fy, 2.5, 0, Math.PI * 2); ctx.fill();
  }
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    const view = snap.view || snap.mode;
    if (view === "quan") drawQuan(w, h); else if (view === "shop") drawShop(w, h); else drawGather(w, h);
    processEvents();
    eventLog(w, h);
    drawCaptions(w, h);
    drawAlerts(w, h);
    phaseIntro(w, h);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
</body>
