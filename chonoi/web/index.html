<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · P/Esc = tạm dừng · R = chơi lại.
 * Shop (chế độ day): 1 = mua bình oxy · 2 = mua áo phao · Enter = đóng Shop.
 * H = bật/tắt chế độ tương phản cao (hoặc mở với ?contrast=high).
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? (snap.view || snap.mode) : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"),
           pause: down.has("pause"), shop_done: down.has("shop_done"),
           net: down.has("net"), sprint: down.has("sprint") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
// Dùng phím VẬT LÝ (e.code) cho chữ/số/Space để bộ gõ (Telex "ee" -> "ê") hay bố cục bàn phím không làm mất phím E, F, G, WASD.
function keyName(e) {
  const c = e.code || "";
  if (/^Key[A-Z]$/.test(c)) return c.slice(3).toLowerCase();
  if (/^Digit[0-9]$/.test(c)) return c.slice(5);
  if (c === "Space") return " ";
  return e.key.toLowerCase();
}
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === "f") down.add("net");
  else if (k === "g") down.add("sprint");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "h") { setContrast(!highContrast); }
  else if (k === "p" || k === "escape") down.add("pause");
  else if (k === "enter") down.add("shop_done");
  else if (k === "1" || k === "2" || k === "3") { queue.push(JSON.stringify({ buy: { "1": "oxygen", "2": "hp", "3": "net" }[k] })); flush(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === "f") down.delete("net");
  else if (k === "g") down.delete("sprint");
  else if (k === " ") down.delete("catch");
  else if (k === "p" || k === "escape") down.delete("pause");
  else if (k === "enter") down.delete("shop_done");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
// Poll song song (tối đa 4 yêu cầu đang chờ, mỗi 33 ms một yêu cầu): qua mạng chậm/tunnel thì độ trễ
// không còn giới hạn tốc độ cập nhật. Chỉ nhận snapshot mới hơn cái đang hiện (theo tick).
let inflightPolls = 0, failStreak = 0;
async function pollOnce() {
  inflightPolls++;
  try {
    const r = await fetch("/state", { cache: "no-store" });
    const s = await r.json();
    if (!snap || s.tick >= snap.tick || s.tick < 5) snap = s;  // tick nhỏ: vừa chơi lại (R)
    offline = false; failStreak = 0;
  } catch (e) { if (++failStreak > 6) offline = true; }
  inflightPolls--;
}
setInterval(() => { if (inflightPolls < 4) pollOnce(); }, 33);
pollOnce();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const KIND_EMOJI = { ca_loc: "🐟", ca_linh: "🐠", ca_keo: "🐡", bong_dien_dien: "🌼", bong_sung: "🪷", keo_neo: "🌿" };
const DISH_EMOJI = { ca_loc_nuong_trui: "🐟", goi_bong_sung: "🥗", lau_ca_linh_dien_dien: "🍲", canh_chua_ca_loc: "🥣", ca_keo_nuong: "🍢", lau_mam: "🫕" };
function rrect(x, y, w, h, rad) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, rad); else ctx.rect(x, y, w, h); }

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center" });
}
function panel(x, y, w, h) {
  ctx.fillStyle = highContrast ? "rgba(0,0,0,.92)" : "rgba(8,16,24,.62)";
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill(); } else ctx.fillRect(x, y, w, h);
}
let introKey = "", introAt = 0;
function phaseIntro(w, h) {
  // DayIntro / EveningIntro / Shop: hiện 3.5 s mỗi khi đổi pha (chỉ là màn UI, không chiếm tick)
  const view = snap.view || snap.mode, key = (snap.day || 0) + ":" + view;
  if (key !== introKey) { introKey = key; introAt = performance.now(); }
  const t = (performance.now() - introAt) / 1000;
  if (t > 3.5 || snap.finished) return;
  ctx.globalAlpha = Math.min(1, (3.5 - t) * 1.5);
  panel(w / 2 - 340, h / 2 - 120, 680, 220);
  const day = snap.day ? "Ngày " + snap.day + " · " : "";
  const title = { gather: "Buổi sáng — Lặn & Hái", quan: "Buổi tối — Mở Quán", shop: "Shop cuối ngày" }[view] || view;
  text(day + title, w / 2, h / 2 - 62, { align: "center", size: 32, color: "#ffd180" });
  const lines = {
    gather: ["Lặn bắt cá (Space), hái rau trên mặt nước (E), về Bến bấm E để mở quán.",
             "Theo dõi Oxy — nổi lên mặt nước để thở. Tránh Cá Sấu ở vùng sâu!"],
    quan: [snap.demo ? "Má Tư đã đi chợ mua thêm đủ nguyên liệu theo kế hoạch (chế độ demo)." : "Khách tới ngồi bàn và gọi món từ kho bạn mang về.",
           "Tới Bếp bấm E để nấu → lấy món chín → mang tới Bàn bấm E."],
    shop: ["1: Bình oxy · 2: Áo phao · 3: Vợt hút cá · Enter: sang ngày mới",
           "Nâng cấp có hiệu lực từ Ngày kế."] }[view] || [];
  lines.forEach((l, i) => text(l, w / 2, h / 2 - 16 + i * 28, { align: "center", size: 18 }));
  if (view === "gather" && snap.day_plan) {
    const dishes = Object.entries(snap.day_plan.dishes).map(([d, n]) => (DISH_NAME[d] || d) + " ×" + n).join(", ");
    text("Má Tư định nấu: " + dishes, w / 2, h / 2 + 56, { align: "center", size: 18, color: "#a5d6a7" });
  }
  ctx.globalAlpha = 1;
}
function fmtItems(items) {
  // v1.2: kho cá thể -> "cá lóc×2 (tươi 87%), bông súng×1 (ươn 1)"
  if (!Array.isArray(items) || !items.length) return "(trống)";
  const g = {};
  items.forEach((it) => { const e = (g[it.kind] = g[it.kind] || { n: 0, min: 100, bad: 0 }); e.n++; e.min = Math.min(e.min, it.fresh); if (it.fresh < 30) e.bad++; });
  return Object.keys(g).map((k) => (KIND_NAME[k] || k) + "×" + g[k].n + " (tươi ≥" + Math.floor(g[k].min) + "%" + (g[k].bad ? ", ươn " + g[k].bad : "") + ")").join(", ");
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-6);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 70 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: "rgba(232,238,242,.75)" }));
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap.state === "paused") {
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, w, h);
    text("Tạm dừng", w / 2, h / 2 - 10, { align: "center", size: 32 });
    text("P / Esc để tiếp tục · R để chơi lại", w / 2, h / 2 + 24, { align: "center", size: 18, color: "#cfd8dc" });
  }
  if (snap.day) text(`Ngày ${snap.day} · ${snap.view === "gather" ? "Sáng" : snap.view === "quan" ? "Tối" : "Shop"}`, w / 2, 24, { align: "center", size: 18, color: "#ffd180" });
  if (snap.finished && snap.day && snap.reason === "days_complete") { drawSummary(w, h); return; }
  if (snap.finished) {
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(w / 2 - 190, h / 2 - 50, 380, 100);
    const label = snap.day ? "Hết lượt chơi" : "Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc";
    text(label + ": " + (snap.reason || ""), w / 2, h / 2 - 12, { align: "center", size: 20 });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 20, { align: "center", color: "#cfd8dc" });
  }
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 116, bottom = 56;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  // trời (nắng, mây) + nước (gradient, tia nắng, sóng) + đáy cát, rong
  const T = Date.now() / 1000;
  const sky = ctx.createLinearGradient(0, top, 0, oy);
  sky.addColorStop(0, "#ffd59e"); sky.addColorStop(1, "#bfe6f7");
  ctx.fillStyle = sky; ctx.fillRect(0, top, w, SKY * s);
  ctx.fillStyle = "#fff3b0"; ctx.beginPath(); ctx.arc(w - 90, top + 2.2 * s, 1.4 * s, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.85)";
  for (let i = 0; i < 4; i++) {
    const cx = ((i * 330 + T * 12) % (w + 200)) - 100, cy = top + (1 + (i % 2)) * s;
    ctx.beginPath(); ctx.ellipse(cx, cy, 2.2 * s, 0.6 * s, 0, 0, Math.PI * 2); ctx.ellipse(cx + 1.2 * s, cy - 0.35 * s, 1.3 * s, 0.55 * s, 0, 0, Math.PI * 2); ctx.fill();
  }
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#3fb6dd"); g.addColorStop(0.35, "#1b78a8"); g.addColorStop(1, "#06213a");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.save(); ctx.globalAlpha = 0.08; ctx.fillStyle = "#ffffff";
  for (let i = 0; i < 6; i++) {
    const x0 = sx(8 + i * 17 + Math.sin(T * 0.4 + i) * 3);
    ctx.beginPath(); ctx.moveTo(x0, oy); ctx.lineTo(x0 + 2 * s, oy); ctx.lineTo(x0 + 7 * s, sy(D * 0.7)); ctx.lineTo(x0 + 3 * s, sy(D * 0.7)); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = "#c2a878"; ctx.beginPath(); ctx.moveTo(sx(0), sy(D));
  for (let x = 0; x <= X; x += 2) ctx.lineTo(sx(x), sy(D - 0.6 - 0.5 * Math.sin(x * 0.7)));
  ctx.lineTo(sx(X), sy(D)); ctx.fill();
  ctx.strokeStyle = "#2e7d32"; ctx.lineWidth = 3;
  for (let x = 3; x < X; x += 7) {
    ctx.beginPath(); ctx.moveTo(sx(x), sy(D - 0.5));
    ctx.quadraticCurveTo(sx(x + Math.sin(T + x) * 0.8), sy(D - 2), sx(x + Math.sin(T * 1.3 + x) * 1.2), sy(D - 3.5)); ctx.stroke();
  }
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy);
  for (let x = 0; x <= X; x += 1) ctx.lineTo(sx(x), oy + Math.sin(x * 0.9 + T * 3) * 0.12 * s);
  ctx.stroke(); ctx.lineWidth = 1;
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { size: 10, color: "rgba(255,255,255,.4)" });
  }
  // bến
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(dp[0]), sy(-2.8), { size: 11, align: "center", color: "#5a3a22" });
  // nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = "#3d8b3d"; ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) + 0.05 * s, 1.2 * s, 0.35 * s, 0, 0, Math.PI * 2); ctx.fill();
    text(KIND_EMOJI[n.kind] || "•", sx(n.pos[0]), sy(n.pos[1]) + 0.1 * s, { size: Math.max(16, 1.4 * s), align: "center" });
    ctx.globalAlpha = 1;
    text((KIND_NAME[n.kind] || n.kind) + (ready ? " (E)" : ""), sx(n.pos[0]), sy(n.pos[1]) - 0.7 * s, { size: 12, align: "center", color: "#123" });
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 1.1 * s, { size: 10, align: "center", color: "#fff" });
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    ctx.restore();
    text((KIND_NAME[f.kind] || f.kind) + " ×" + ((meta.fish_yield || {})[f.kind] || 1), sx(f.pos[0]), sy(f.pos[1]) - 0.7 * s, { size: 12, align: "center", color: "rgba(255,255,255,.9)" });
  });
  // Cá Sấu Năm Chèo
  (snap.monsters || []).forEach((m) => {
    const mx = sx(m.pos[0]), my = sy(m.pos[1]), chase = m.state === "chase";
    ctx.save(); ctx.translate(mx, my);
    ctx.fillStyle = chase ? "#8e24aa" : m.state === "recoil" ? "#558b2f" : "#2e7d32";
    ctx.beginPath(); ctx.ellipse(0, 0, 1.8 * s, 0.55 * s, 0, 0, Math.PI * 2); ctx.fill();          // thân
    ctx.beginPath(); ctx.ellipse(1.9 * s, 0, 0.9 * s, 0.3 * s, 0, 0, Math.PI * 2); ctx.fill();     // mõm
    ctx.beginPath(); ctx.moveTo(-1.6 * s, 0); ctx.lineTo(-3 * s, -0.35 * s); ctx.lineTo(-3 * s, 0.35 * s); ctx.fill(); // đuôi
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(1.3 * s, -0.35 * s, 0.14 * s, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    text("🐊 Cá Sấu" + (chase ? " — đang đuổi!" : ""), mx, my - 0.9 * s, { size: 13, align: "center", color: chase ? "#ff80ab" : "#c8e6c9" });
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    const sk = p.skills || {};
    if (sk.net_on && underwater) { ctx.fillStyle = "rgba(255,230,120,.12)"; ctx.strokeStyle = "rgba(255,230,120,.8)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px, py, sk.net_radius * s, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.lineWidth = 1; }
    else if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      const a = ((p.heading_deg || 0) * Math.PI) / 180, flip = Math.cos(a) < 0 ? -1 : 1;
      ctx.save(); ctx.translate(px, py); ctx.scale(flip, 1);
      ctx.fillStyle = "#ff7043"; ctx.beginPath(); ctx.ellipse(-0.2 * s, 0, 0.9 * s, 0.38 * s, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#ffcc80"; ctx.beginPath(); ctx.arc(0.75 * s, -0.05 * s, 0.38 * s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#4dd0e1"; ctx.fillRect(0.8 * s, -0.22 * s, 0.32 * s, 0.22 * s);
      ctx.fillStyle = "#455a64"; ctx.fillRect(-0.75 * s, -0.55 * s, 0.7 * s, 0.25 * s);
      ctx.restore();
      text("Út Sen", px, py - 0.85 * s, { size: 12, align: "center", color: "#fff" });
    }
    const T2 = Date.now() / 1000;
    if (underwater) {
      for (let i = 0; i < 3; i++) {
        const t2 = (T2 * 1.5 + i / 3) % 1;
        ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.beginPath(); ctx.arc(px + Math.sin(T2 * 3 + i) * 0.3 * s, py - t2 * 2.5 * s, (0.12 + 0.08 * i) * s, 0, Math.PI * 2); ctx.stroke();
      }
    }
    const hint = gatherHint(meta, p, underwater);
    if (hint) {
      ctx.font = "16px system-ui, sans-serif"; const tw = ctx.measureText(hint).width + 20;
      panel(px - tw / 2, py + 0.9 * s, tw, 26);
      text(hint, px, py + 0.9 * s + 19, { size: 16, align: "center", color: "#ffeb3b" });
    }
    const dp2 = meta.dock_pos || [2, 0];
    const full = snap.hold && snap.hold_capacity && snap.hold.length >= snap.hold_capacity;
    if ((full || snap.time_left_ticks < 20 * 60) && Math.hypot(p.pos[0] - dp2[0], p.pos[1] - dp2[1]) > (meta.dock_radius || 3)) {
      const ang = Math.atan2(sy(dp2[1]) - py, sx(dp2[0]) - px), ax = px + Math.cos(ang) * 2.2 * s, ay = py + Math.sin(ang) * 2.2 * s;
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(ang); ctx.fillStyle = "#ffeb3b";
      ctx.beginPath(); ctx.moveTo(0.7 * s, 0); ctx.lineTo(-0.3 * s, -0.4 * s); ctx.lineTo(-0.3 * s, 0.4 * s); ctx.fill(); ctx.restore();
      text(full ? "Giỏ đầy — về bến!" : "Sắp hết giờ — về bến!", ax, ay - 0.6 * s, { size: 14, align: "center", color: "#ffeb3b" });
    }
  }
  // HUD trên (nền tối cho dễ đọc)
  panel(6, 4, w - 12, snap.day_plan ? 106 : 82);
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 30, { size: 22, color: snap.time_left_ticks <= 1800 ? "#ff8a80" : "#e8eef2" });
  // kỹ năng thêm (F lưới, G tăng tốc) và báo giỏ đầy: dưới khung HUD
  if (p && p.skills) text((p.skills.net_on ? "Lưới lớn (F) " : "") + (p.skills.sprint_on ? "Tăng tốc (G)" : ""), 14, 108, { size: 15, color: "#ffe082" });
  const full = (snap.events || []).filter((e) => e.name === "hold_full" && snap.tick - e.tick < 120).pop();
  if (full && full.data) text(`Giỏ không đủ chỗ: cần ${full.data.required}, còn ${full.data.free}`, w / 2, 112, { size: 18, align: "center", color: "#ff8a80" });
  const need = needList();
  if (need) text("🧺 Cần lấy: " + need, 14, 76, { size: 18, color: "#ffd180" });
  if (snap.day_plan) text(planText() + (snap.demo ? "   (demo: tối Má Tư mua thêm đủ nguyên liệu)" : ""), 14, 100, { size: 17, color: "#a5d6a7" });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(110, 12, 220, 18, p.oxygen_ticks / p.oxygen_max_ticks, low ? "#ef5350" : "#4fc3f7", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
  }
  if (p && p.hp !== undefined && p.hp_max) {

  }
  if (p && p.pos) text(`Độ sâu ${p.pos[1].toFixed(1)} m` + (p.pos[1] >= 20 ? " (sâu)" : p.pos[1] >= 10 ? " (giữa)" : " (nông)"), 14, 54, { size: 16, color: "#b3e5fc" });
  if (p && p.catch_cd_ticks > 0) text("Hồi bắt cá " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 230, 54, { size: 16, color: "#9fb3c0" });
  // giỏ (khoang) dưới
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.min(30, (w - 260) / cap - 4), y0 = h - bottom + 8;
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      const it = snap.hold[i];
      if (it) {
        ctx.fillStyle = kc(it.kind); ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6);
        text(KIND_EMOJI[it.kind] || "", x0 + sz / 2, y0 + sz * 0.72, { size: Math.max(12, sz * 0.6), align: "center" });
        const f = it.fresh / 100;   // thanh độ tươi dưới ô: xanh -> vàng -> đỏ, ươn (< 30) gạch chéo
        ctx.fillStyle = it.fresh < 30 ? "#e53935" : it.fresh < 60 ? "#fdd835" : "#66bb6a";
        ctx.fillRect(x0 + 2, y0 + sz - 5, (sz - 4) * f, 3);
        if (it.fresh < 30) { ctx.strokeStyle = "#e53935"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x0 + 3, y0 + 3); ctx.lineTo(x0 + sz - 3, y0 + sz - 3); ctx.stroke(); ctx.lineWidth = 1; }
      }

  }
  text("WASD/mũi tên bơi · E hái / cập bến · Space bắt cá · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 150, bottom = 84;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  const T = Date.now() / 1000;
  // sông quanh nhà bè
  const river = ctx.createLinearGradient(0, oy - 20, 0, sy(0) + 40);
  river.addColorStop(0, "#1e6f8f"); river.addColorStop(1, "#0b3d55");
  ctx.fillStyle = river; ctx.fillRect(0, oy - 30, w, Z * s + 70);
  ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.lineWidth = 2;
  for (let k = 0; k < 7; k++) { const yy = oy - 20 + k * (Z * s + 60) / 7; ctx.beginPath();
    for (let x = 0; x <= w; x += 20) ctx.lineTo(x, yy + Math.sin(x / 40 + T * 2 + k) * 3); ctx.stroke(); }
  // nhà bè: sàn ván gỗ + viền + mái hiên bếp
  ctx.fillStyle = "#d9b27c"; rrect(sx(0) - 8, sy(Z) - 8, X * s + 16, Z * s + 16, 14); ctx.fill();
  ctx.save(); rrect(sx(0), sy(Z), X * s, Z * s, 8); ctx.clip();
  for (let z = 0; z < Z; z++) {
    ctx.fillStyle = z % 2 ? "#cfa271" : "#d8ad7b"; ctx.fillRect(sx(0), sy(z + 1), X * s, s);
    ctx.strokeStyle = "rgba(90,60,30,.35)"; ctx.lineWidth = 1;
    for (let x = (z % 2) * 2; x < X; x += 4) { ctx.beginPath(); ctx.moveTo(sx(x), sy(z + 1)); ctx.lineTo(sx(x), sy(z)); ctx.stroke(); }
  }
  ctx.fillStyle = "rgba(120,70,30,.35)"; ctx.fillRect(sx(0), sy(Z), 7.5 * s, 3.2 * s);  // khu bếp
  ctx.restore();
  ctx.strokeStyle = "#6b4226"; ctx.lineWidth = 6; rrect(sx(0) - 4, sy(Z) - 4, X * s + 8, Z * s + 8, 12); ctx.stroke(); ctx.lineWidth = 1;
  text("🍳 Khu bếp", sx(0.3), sy(Z) + 22, { size: 15, color: "#4e2a10" });
  // đèn lồng
  [[0.6, Z - 0.2], [X - 0.6, Z - 0.2], [X - 0.6, 0.6], [0.6, 0.6]].forEach(([lx, lz], k) => {
    const glow = 0.5 + 0.2 * Math.sin(T * 2 + k);
    ctx.fillStyle = `rgba(255,180,80,${glow * 0.35})`; ctx.beginPath(); ctx.arc(sx(lx), sy(lz), 1.1 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#d32f2f"; ctx.beginPath(); ctx.ellipse(sx(lx), sy(lz), 0.32 * s, 0.42 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffca28"; ctx.fillRect(sx(lx) - 0.2 * s, sy(lz) - 0.48 * s, 0.4 * s, 0.1 * s);
  });
  // bếp lò đất
  (snap.stoves || []).forEach((st) => {
    const bx = sx(st.pos[0]), by = sy(st.pos[1]);
    if (st.state === "ready") { ctx.fillStyle = `rgba(120,255,120,${0.35 + 0.2 * Math.sin(T * 6)})`; ctx.beginPath(); ctx.arc(bx, by, 1.3 * s, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = "#5d4037"; rrect(bx - 0.95 * s, by - 0.8 * s, 1.9 * s, 1.6 * s, 10); ctx.fill();
    ctx.fillStyle = "#3e2723"; ctx.beginPath(); ctx.arc(bx, by, 0.55 * s, 0, Math.PI * 2); ctx.fill();
    if (st.state === "cooking") {
      for (let k = 0; k < 3; k++) {
        const fx = bx + (k - 1) * 0.25 * s, fh = (0.35 + 0.15 * Math.sin(T * 12 + k)) * s;
        ctx.fillStyle = k === 1 ? "#ffca28" : "#ff7043"; ctx.beginPath(); ctx.moveTo(fx - 0.12 * s, by + 0.2 * s); ctx.lineTo(fx, by + 0.2 * s - fh); ctx.lineTo(fx + 0.12 * s, by + 0.2 * s); ctx.fill();
      }
      const d = st.dish && st.dish.dish_id, total = d && snap.menu && snap.menu[d] ? snap.menu[d].cook_s * 60 : 0;
      if (total) { ctx.strokeStyle = "#ffeb3b"; ctx.lineWidth = 5; ctx.beginPath();
        ctx.arc(bx, by, 0.75 * s, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - st.cook_ticks_left / total)); ctx.stroke(); ctx.lineWidth = 1; }
    }
    text(st.state === "idle" ? "🍳" : (DISH_EMOJI[st.dish && st.dish.dish_id] || "🍲"), bx, by + 0.2 * s, { size: Math.max(18, 0.75 * s), align: "center" });
    const dn = st.dish ? (DISH_NAME[st.dish.dish_id] || st.dish.dish_id) : "";
    const label = st.state === "cooking" ? "🔥 " + dn + " · " + Math.ceil((st.cook_ticks_left || 0) / 60) + "s"
      : st.state === "ready" ? "✅ CHÍN — bấm E lấy" : "Bếp " + st.id + " · trống";
    ctx.font = "13px system-ui, sans-serif"; const lw = ctx.measureText(label).width + 14;
    ctx.fillStyle = st.state === "ready" ? "#1b5e20" : "rgba(40,25,15,.85)"; rrect(bx - lw / 2, by + 0.95 * s, lw, 22, 8); ctx.fill();
    text(label, bx, by + 0.95 * s + 16, { size: 13, align: "center", color: "#fff" });
  });
  // bàn ăn + khách
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    const tx = sx(tb.pos[0]), ty = sy(tb.pos[1]);
    ctx.fillStyle = "#795548"; [[-1, 0.2], [1, 0.2]].forEach(([dx, dz]) => { ctx.beginPath(); ctx.arc(tx + dx * 1.05 * s, ty + dz * s, 0.28 * s, 0, Math.PI * 2); ctx.fill(); });
    ctx.fillStyle = "#8d5a2b"; ctx.beginPath(); ctx.arc(tx, ty, 0.85 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff8e1"; ctx.beginPath(); ctx.arc(tx, ty, 0.65 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#e57373"; ctx.lineWidth = 2; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.arc(tx, ty, 0.55 * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
    text("Bàn " + tb.id, tx, ty + 5, { size: 13, align: "center", color: "#4e342e" });
    const c = byTable[tb.id];
    if (!c) { text("trống", tx, ty + 1.3 * s, { size: 12, align: "center", color: "#5d4037" }); return; }
    const cx = tx, cy = ty - 1.45 * s;
    const f = c.state === "waiting" && c.patience_ticks_left !== undefined ? c.patience_ticks_left / patMax : 1;
    const face = c.state === "eating" ? "😋" : f < 0.25 ? "😠" : f < 0.5 ? "😐" : "🙂";
    ctx.fillStyle = c.state === "eating" ? "#c8e6c9" : "#fde0dc"; ctx.beginPath(); ctx.arc(cx, cy, 0.6 * s, 0, Math.PI * 2); ctx.fill();
    if (c.state === "waiting") {
      ctx.strokeStyle = f < 0.25 ? "#e53935" : f < 0.5 ? "#fdd835" : "#43a047"; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(cx, cy, 0.74 * s, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * f); ctx.stroke(); ctx.lineWidth = 1;
    }
    text(face, cx, cy + 0.24 * s, { size: Math.max(18, 0.85 * s), align: "center" });
    const st = { reserved: "chờ nấu", assigned: "đang nấu", unfulfillable: "thiếu nguyên liệu!", served: "đang ăn" }[c.order_status] || c.state;
    const bubble = (DISH_EMOJI[c.dish_id] || "🍽") + " " + (DISH_NAME[c.dish_id] || c.dish_id) + " · " + st;
    ctx.font = "14px system-ui, sans-serif"; const bw = ctx.measureText(bubble).width + 18;
    ctx.fillStyle = "#fffdf5"; ctx.strokeStyle = "#8d6e63"; ctx.lineWidth = 2;
    rrect(cx - bw / 2, cy - 1.6 * s, bw, 26, 10); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - 6, cy - 1.6 * s + 26); ctx.lineTo(cx, cy - 1.6 * s + 34); ctx.lineTo(cx + 6, cy - 1.6 * s + 26); ctx.fill(); ctx.lineWidth = 1;
    text(bubble, cx, cy - 1.6 * s + 18, { size: 14, align: "center", color: c.order_status === "unfulfillable" ? "#c62828" : "#3e2723" });
  });
  // chỉ dẫn từng bước + vòng sáng ở chỗ cần tới
  const step = quanStep();
  if (step.target) {
    const r = (1.3 + 0.25 * Math.sin(Date.now() / 180)) * s;
    ctx.strokeStyle = "#ffeb3b"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(sx(step.target.pos[0]), sy(step.target.pos[1]), r, 0, Math.PI * 2); ctx.stroke(); ctx.lineWidth = 1;
  }
  if (step.text) {
    ctx.fillStyle = "rgba(0,0,0,.72)"; ctx.fillRect(w / 2 - 300, h - 74, 600, 34);
    text("Việc cần làm: " + step.text, w / 2, h - 51, { align: "center", size: 17, color: "#ffeb3b" });
  }
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(px, py + 0.45 * s, 0.5 * s, 0.18 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#4fc3f7"; ctx.beginPath(); ctx.arc(px, py, 0.48 * s, 0, Math.PI * 2); ctx.fill();          // áo bà ba
    ctx.fillStyle = "#f2d16b"; ctx.beginPath(); ctx.moveTo(px - 0.6 * s, py - 0.15 * s); ctx.lineTo(px, py - 0.85 * s);
    ctx.lineTo(px + 0.6 * s, py - 0.15 * s); ctx.closePath(); ctx.fill();                                         // nón lá
    ctx.strokeStyle = "#b8943a"; ctx.stroke();
    text("Út Sen", px, py + 0.95 * s, { size: 13, align: "center", color: "#3e2723" });
    if (snap.hand) {
      const d = typeof snap.hand === "string" ? snap.hand : snap.hand.dish_id;
      const lab = (DISH_EMOJI[d] || "🍲") + " " + (DISH_NAME[d] || d);
      ctx.font = "14px system-ui, sans-serif"; const hw = ctx.measureText(lab).width + 14;
      ctx.fillStyle = "#fff59d"; rrect(px - hw / 2, py - 1.35 * s, hw, 24, 8); ctx.fill();
      text(lab, px, py - 1.35 * s + 17, { size: 14, align: "center", color: "#3e2723" });
    }
  }
  // HUD
  panel(6, 4, Math.min(w - 12, 980), snap.day_plan ? 126 : 102);
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 30, { size: 22 });
  text(`💰 ${snap.money ?? 0}k · ⭐ uy tín ${(snap.reputation ?? 0).toFixed(1)} · điểm ${snap.score ?? 0}`, 110, 30, { size: 18 });
  const stock = fmtItems(snap.stock);
  text("Kho: " + (stock || "(trống)"), 14, 54, { size: 16, color: "#cfd8dc" });
  quanGuide(w, h);
  text("WASD/mũi tên đi · E tương tác (bếp / bàn) · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

function dayStats(day) { return (snap.stats || []).find((x) => x.day === day) || null; }
function drawDayResult(w, h, y) {
  // DayResult: khách đã phục vụ / bỏ đi, tiền, boa, đổi uy tín
  const st = dayStats(snap.day);
  if (!st) return;
  panel(w / 2 - 330, y, 660, 150);
  text("Kết quả Ngày " + snap.day, w / 2, y + 32, { align: "center", size: 24, color: "#ffd180" });
  const dRep = st.rep_end != null && st.rep_start != null ? st.rep_end - st.rep_start : 0;
  text(`🍽 Phục vụ ${st.served} khách · 😠 bỏ đi ${st.left} · 🚫 không có món ${st.no_dish}` + (st.burnt ? ` · 🔥 cháy ${st.burnt}` : ""),
       w / 2, y + 66, { align: "center", size: 18 });
  text(`💰 Thu ${st.money}k (boa ${st.tips}k) · ⭐ uy tín ${dRep >= 0 ? "+" : ""}${dRep.toFixed(1)}`, w / 2, y + 96, { align: "center", size: 18 });
  text(`Sáng: bắt ${st.caught} đàn cá, hái ${st.gathered} lần` + (st.spoiled ? `, ${st.spoiled} món bị ươn` : ""), w / 2, y + 126, { align: "center", size: 16, color: "#b3e5fc" });
}
function drawSummary(w, h) {
  // Summary sau Ngày cuối: tổng tiền, điểm, uy tín, món bán chạy
  const all = snap.stats || [];
  const dishes = {};
  all.forEach((st) => Object.entries(st.dishes || {}).forEach(([d, n]) => (dishes[d] = (dishes[d] || 0) + n)));
  const best = Object.entries(dishes).sort((a, b) => b[1] - a[1])[0];
  ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, w, h);
  panel(w / 2 - 340, h / 2 - 170, 680, 320);
  text("🏮 Tổng kết " + all.length + " Ngày ở chợ nổi", w / 2, h / 2 - 120, { align: "center", size: 30, color: "#ffd180" });
  text(`💰 Tổng thu ${snap.earned}k · còn ${snap.money}k`, w / 2, h / 2 - 66, { align: "center", size: 22 });
  text(`⭐ Uy tín ${(snap.reputation || 0).toFixed(1)} · 🏆 Điểm ${snap.score}`, w / 2, h / 2 - 30, { align: "center", size: 22 });
  text("Khách đã phục vụ: " + all.reduce((a, st) => a + st.served, 0) + " · bỏ đi: " + all.reduce((a, st) => a + st.left, 0), w / 2, h / 2 + 6, { align: "center", size: 18 });
  text("Món bán chạy: " + (best ? (DISH_NAME[best[0]] || best[0]) + " ×" + best[1] : "chưa có"), w / 2, h / 2 + 40, { align: "center", size: 18, color: "#a5d6a7" });
  text("Nhấn R để chơi lại", w / 2, h / 2 + 96, { align: "center", size: 18, color: "#cfd8dc" });
}
function drawShop(w, h) {
  const ups = (snap.meta && snap.meta.upgrades) || {};
  text("Shop cuối Ngày " + snap.day, w / 2, 70, { align: "center", size: 28 });
  text(`Tiền ${snap.money ?? 0}k · tự đóng sau ${fmtTime(snap.time_left_ticks)}`, w / 2, 104, { align: "center", size: 18, color: "#cfd8dc" });
  const rows = [["1", "oxygen", "Bình oxy", "oxygen_max_s", "s"], ["2", "hp", "Áo phao", "hp_max", " Máu"], ["3", "net", "Vợt hút cá (đàn tối đa)", "max_schools", " đàn"]];
  rows.forEach(([key, id, name, field, unit], i) => {
    const lv = (snap.upgrades || {})[id] || 0, levels = ups[id] || [];
    const next = levels[lv];
    const y = 160 + i * 60;
    text(`[${key}] ${name} — cấp ${lv}/${levels.length}`, w / 2 - 220, y, { size: 20 });
    text(next ? `cấp ${next.level}: ${next[field]}${unit} · giá ${next.price}k` : "đã tối đa", w / 2 + 40, y, { size: 18, color: next && next.price <= snap.money ? "#a5d6a7" : "#ef9a9a" });
  });
  text("Cấp vừa mua có hiệu lực từ Ngày kế · Enter đóng Shop", w / 2, 300, { align: "center", size: 16, color: "#9fb3c0" });
  const stock = fmtItems(snap.stock);
  text("Kho dư (bỏ sau Shop): " + (stock || "(trống)"), w / 2, 330, { align: "center", size: 14, color: "#cfd8dc" });
  drawDayResult(w, h, 360);
}

// ---------- hướng dẫn quán: khách kế tiếp, món nấu được, vì sao không có khách ----------
const DISH_NAME = { ca_loc_nuong_trui: "Cá lóc nướng trui", goi_bong_sung: "Gỏi bông súng", lau_ca_linh_dien_dien: "Lẩu cá linh",
  canh_chua_ca_loc: "Canh chua cá lóc", ca_keo_nuong: "Cá kèo nướng", lau_mam: "Lẩu mắm" };
function cookable() {
  const have = {};
  (snap.stock || []).forEach((it) => { if (it.fresh >= 30) have[it.kind] = (have[it.kind] || 0) + 1; });
  (snap.customers || []).forEach((c) => (c.reserved || []).forEach((id) => {
    const it = (snap.stock || []).find((x) => x.id === id); if (it && have[it.kind]) have[it.kind]--; }));
  return Object.keys(snap.menu || {}).filter((d) => Object.entries(snap.menu[d].recipe).every(([k, n]) => (have[k] || 0) >= n));
}
function quanGuide(w, h) {
  const m = snap.meta || {}, pt = snap.phase_tick || 0, first = m.first_customer_tick || 120, every = (m.customer_interval_s || 15) * 60;
  const next = pt < first ? first - pt : (every - ((pt - first) % every)) % every;
  const freeTables = (snap.tables || []).filter((t) => !t.customer_id).length;
  const ok = cookable();
  text(`Khách kế tiếp sau ${fmtTime(next)} · bàn trống ${freeTables}/${(snap.tables || []).length}`, 14, 76, { size: 18, color: "#ffd180" });
  text("Món nấu được từ kho: " + (ok.length ? ok.map((d) => DISH_NAME[d] || d).join(", ") : "không có"), 14, 98,
       { size: 18, color: ok.length ? "#a5d6a7" : "#ef9a9a" });
  if (snap.day_plan) text(planText(), 14, 120, { size: 17, color: "#ffd180" });
  const recentNoDish = (snap.events || []).some((e) => e.name === "no_dish" && snap.tick - e.tick < 240);
  if (!ok.length || recentNoDish) {
    const y = h / 2 - 40;
    ctx.fillStyle = "rgba(0,0,0,.7)"; ctx.fillRect(w / 2 - 330, y - 30, 660, 74);
    text("Khách chỉ vào khi kho đủ nguyên liệu cho ít nhất 1 món" + (snap.day ? " trong kế hoạch" : "") + ".", w / 2, y, { align: "center", size: 18, color: "#ffd180" });
    text(recentNoDish ? "Vừa có khách tới nhưng không món nào nấu được nên khách đi (no_dish)." : "Buổi sáng hãy lặn hái đủ nguyên liệu theo danh sách cần lấy.",
         w / 2, y + 28, { align: "center", size: 15, color: "#cfd8dc" });
  }
}
function quanStep() {
  // Bước tiếp theo dễ hiểu nhất cho người chơi: lấy món -> bưng -> nấu
  const cust = snap.customers || [], stoves = snap.stoves || [], tables = snap.tables || [];
  const dn = (id) => DISH_NAME[id] || id;
  if (snap.hand && snap.hand.order_id) {
    const c = cust.find((x) => x.id === snap.hand.order_id);
    const tb = c && tables.find((t) => t.id === c.table_id);
    if (tb) return { target: tb, text: `③ Mang ${dn(snap.hand.dish_id)} tới Bàn ${tb.id}, đứng sát bàn bấm E` };
  }
  const ready = stoves.find((st) => st.state === "ready");
  if (ready && !snap.hand) return { target: ready, text: `② Món chín ở Bếp ${ready.id} — tới bếp bấm E để lấy` };
  const waiting = cust.filter((c) => c.state === "waiting" && c.order_status === "reserved").sort((a, b) => a.order_tick - b.order_tick);
  const idle = stoves.find((st) => st.state === "idle");
  if (waiting.length && idle) return { target: idle, text: `① Tới Bếp ${idle.id} bấm E để nấu ${dn(waiting[0].dish_id)} cho Bàn ${waiting[0].table_id}` };
  const cooking = stoves.find((st) => st.state === "cooking");
  if (cooking) return { target: cooking, text: `Đang nấu ở Bếp ${cooking.id}… còn ${Math.ceil(cooking.cook_ticks_left / 60)}s` };
  if (cust.some((c) => c.state === "eating")) return { text: "Khách đang ăn, ăn xong sẽ tự trả tiền và boa" };
  return {};
}
function gatherHint(meta, p, underwater) {
  const near = (arr, r) => (arr || []).map((e) => [Math.hypot(e.pos[0] - p.pos[0], e.pos[1] - p.pos[1]), e]).filter((x) => x[0] <= r).sort((a, b) => a[0] - b[0]).map((x) => x[1]);
  const dp = meta.dock_pos || [2, 0];
  if (Math.hypot(p.pos[0] - dp[0], p.pos[1] - dp[1]) <= (meta.dock_radius || 3)) return "E: về bến, mở quán tối";
  if (!underwater) {
    const n = near((snap.nodes || []).filter((x) => x.ready !== false), meta.interact_radius || 2)[0];
    if (n) return "E: hái " + (KIND_NAME[n.kind] || n.kind);
    return p.pos[1] <= 0.5 ? "S / ↓: lặn xuống bắt cá" : "";
  }
  const f = near(snap.fish, meta.catch_radius || 2)[0];
  if (f) return p.catch_cd_ticks > 0 ? "Chờ hồi bắt cá…" : "Space: bắt " + (KIND_NAME[f.kind] || f.kind) + " ×" + ((meta.fish_yield || {})[f.kind] || 1);
  if (p.oxygen_ticks < p.oxygen_max_ticks * 0.3) return "W / ↑: nổi lên thở!";
  return "";
}
function planText() {
  if (!snap.day_plan) return "";
  return "📋 Hôm nay Má Tư nấu: " + Object.entries(snap.day_plan.dishes).map(([d, n]) => (DISH_NAME[d] || d) + " ×" + n).join(", ");
}
function needList() {
  // HUD sáng: đã lấy / cần lấy theo kế hoạch Ngày
  if (!snap.day_plan) return "";
  const got = {}; (snap.hold || []).forEach((it) => (got[it.kind] = (got[it.kind] || 0) + 1));
  return Object.entries(snap.day_plan.ingredients).map(([k, n]) => (KIND_NAME[k] || k) + " " + Math.min(got[k] || 0, n) + "/" + n).join(" · ");
}

// ---------- cảnh báo dễ nhận biết + tương phản cao (Phase 4) ----------
let highContrast = /contrast=high/.test(location.search);
try { if (localStorage.getItem("chonoi-contrast") === "high") highContrast = true; } catch (e) {}
function setContrast(on) {
  highContrast = on;
  cv.style.filter = on ? "contrast(1.9) saturate(1.3)" : "";
  try { localStorage.setItem("chonoi-contrast", on ? "high" : "normal"); } catch (e) {}
}
setContrast(highContrast);
function alertList() {
  const out = [], view = snap.view || snap.mode, p = snap.player || {};
  if (view === "gather") {
    const near = (snap.monsters || []).some((m) => p.pos && Math.hypot(m.pos[0] - p.pos[0], m.pos[1] - p.pos[1]) <= 10 && p.pos[1] >= 10);
    if (near) out.push({ icon: "🐊", text: "Thủy quái!", color: "#d500f9" });
    if (p.oxygen_max_ticks) {
      const f = p.oxygen_ticks / p.oxygen_max_ticks;
      if (p.oxygen_ticks === 0) out.push({ icon: "🫧", text: "Hết hơi!", color: "#ff1744" });
      else if (f < 0.25) out.push({ icon: "🫧", text: "Oxy sắp hết!", color: "#ff9100" });
    }
  }
  if (view === "quan") {
    const full = ((snap.meta && snap.meta.patience_s) || 60) * 60;
    const angry = (snap.customers || []).filter((c) => c.state === "waiting" && c.patience_ticks_left < 0.25 * full);
    if (angry.length) out.push({ icon: "😠", text: "Khách sắp giận! (bàn " + angry.map((c) => c.table_id).join(", ") + ")", color: "#ff1744" });
  }
  return out;
}
function drawAlerts(w, h) {
  const list = alertList();
  if (list.some((a) => a.icon === "🐊")) {  // viền tím khi thủy quái gần
    ctx.strokeStyle = "#d500f9"; ctx.lineWidth = highContrast ? 14 : 8; ctx.strokeRect(0, 0, w, h); ctx.lineWidth = 1;
  }
  list.forEach((a, i) => {
    const y = 92 + i * 44, size = highContrast ? 26 : 22;
    ctx.fillStyle = highContrast ? "#000" : "rgba(0,0,0,.65)";
    ctx.fillRect(w / 2 - 230, y - size - 6, 460, size + 16);
    if (highContrast) { ctx.strokeStyle = "#ffff00"; ctx.lineWidth = 3; ctx.strokeRect(w / 2 - 230, y - size - 6, 460, size + 16); ctx.lineWidth = 1; }
    text(a.icon + " " + a.text, w / 2, y, { align: "center", size, color: highContrast ? "#ffff00" : a.color });
  });
  if (highContrast) text("Tương phản cao (H để tắt)", 14, h - 34, { size: 14, color: "#ffff00" });
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    const view = snap.view || snap.mode;
    if (view === "quan") drawQuan(w, h); else if (view === "shop") drawShop(w, h); else drawGather(w, h);
    eventLog(w, h);
    drawAlerts(w, h);
    phaseIntro(w, h);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
